[project]
name = "haruna-api-2025"
version = "0.1.0"
description = "Back-end API for the HarunaDB project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "uvicorn[standard]>=0.30.0",
    "pillow>=12.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.12.0",
    "supabase>=2.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=6.0",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
include_namespace_packages = true

[tool.coverage.html]
directory = "coverage"

[tool.coverage.lcov]
output = "coverage/lcov.info"
