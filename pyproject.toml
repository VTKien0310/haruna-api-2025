[project]
name = "haruna-api-2025"
version = "0.1.0"
description = "Back-end API for the HarunaDB project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "uvicorn[standard]>=0.30.0",
    "pillow>=12.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.12.0",
    "supabase>=2.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
